<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseBars {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50% { transform: scaleY(1.0); opacity: 0.9; }
    }
    @keyframes floatWave {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0px); }
    }
    @keyframes ringPulse {
      0% { r: 60px; opacity: 0.6; }
      50% { r: 75px; opacity: 0.2; }
      100% { r: 60px; opacity: 0.6; }
    }
    .eq-bar {
      transform-box: fill-box;
      transform-origin: bottom;
      animation: pulseBars 2.5s ease-in-out infinite;
    }
    .eq-bar-1 { animation-delay: 0.1s; }
    .eq-bar-2 { animation-delay: 0.4s; }
    .eq-bar-3 { animation-delay: 0.2s; }
    .eq-bar-4 { animation-delay: 0.6s; }
    .eq-bar-5 { animation-delay: 0.3s; }
    .eq-bar-6 { animation-delay: 0.7s; }

    .wave-bg {
      animation: floatWave 8s ease-in-out infinite;
    }
    .pulse-ring {
      animation: ringPulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Perspective Lines (Dynamic Background) -->
  <g opacity="0.25">
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#38bdf8" stroke-width="0.5" opacity="0.6" />
    <line x1="0" y1="230" x2="1200" y2="230" stroke="#38bdf8" stroke-width="0.5" opacity="0.3" />
  </g>

  <!-- Dynamic Ambient Audio Waves in Background -->
  <g class="wave-bg" opacity="0.35">
    <path d="M-50,280 Q 150,180 350,260 T 750,220 T 1150,270 T 1300,200" fill="none" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glowCyan)" />
    <path d="M-50,310 Q 200,220 450,300 T 850,240 T 1250,290" fill="none" stroke="url(#neonPink)" stroke-width="2" filter="url(#glowPink)" />
  </g>

  <!-- Animated Equalizer Bars (Dynamic Side Graphic) -->
  <g transform="translate(1000, 160)" opacity="0.75">
    <rect class="eq-bar eq-bar-1" x="0" y="0" width="8" height="110" rx="4" fill="#06b6d4" />
    <rect class="eq-bar eq-bar-2" x="14" y="0" width="8" height="110" rx="4" fill="#3b82f6" />
    <rect class="eq-bar eq-bar-3" x="28" y="0" width="8" height="110" rx="4" fill="#8b5cf6" />
    <rect class="eq-bar eq-bar-4" x="42" y="0" width="8" height="110" rx="4" fill="#ec4899" />
    <rect class="eq-bar eq-bar-5" x="56" y="0" width="8" height="110" rx="4" fill="#3b82f6" />
    <rect class="eq-bar eq-bar-6" x="70" y="0" width="8" height="110" rx="4" fill="#06b6d4" />
  </g>

  <!-- Headset Icon Art Background Glow -->
  <g transform="translate(140, 200)">
    <circle class="pulse-ring" cx="0" cy="0" r="65" fill="none" stroke="#06b6d4" stroke-width="2" />
    <circle cx="0" cy="0" r="50" fill="#1e293b" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glowCyan)" />
    <!-- Headset Vector Path -->
    <path d="M-22,-5 A 25,25 0 0,1 22,-5 M-25,-5 L-25,12 A 6,6 0 0,0 -19,18 L-17,18 A 6,6 0 0,0 -11,12 L-11,-5 A 6,6 0 0,0 -17,-11 L-19,-11 A 6,6 0 0,0 -25,-5 M25,-5 L25,12 A 6,6 0 0,1 19,18 L17,18 A 6,6 0 0,1 11,12 L11,-5 A 6,6 0 0,1 17,-11 L19,-11 A 6,6 0 0,1 25,-5 M-17,18 C-17,25 -5,26 0,26" 
          fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed readable & unobstructed) -->
  <g transform="translate(240, 160)">
    <!-- Category Pill -->
    <rect x="0" y="-75" width="280" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="14" y="-54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">
      🎧 AWESOME HARDWARE &amp; SOFTWARE
    </text>

    <!-- Main Title -->
    <text x="0" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Gaming Headset Hardware
    </text>

    <!-- Subtitle -->
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
      Curated Commercial Leaderboard &amp; Open-Source Audio Ecosystem
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 60)">
      <!-- Badge 1: Audio Drivers -->
      <rect x="0" y="0" width="135" height="28" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🎛️ Equalizers &amp; EQ</text>

      <!-- Badge 2: Open Source -->
      <rect x="145" y="0" width="165" height="28" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="157" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🐧 Linux &amp; Cross-Platform</text>

      <!-- Badge 3: Spatial Sound -->
      <rect x="320" y="0" width="155" height="28" rx="8" fill="#0f172a" stroke="#334155" />
      <text x="332" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔊 Spatial &amp; Low Latency</text>
    </g>
  </g>
</svg>
